<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CiliPro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="installPrompt" class="hidden fixed top-4 left-4 right-4 bg-green-600 text-white p-4 rounded-xl shadow-lg z-50 flex justify-between items-center transition-all">
        <div>
            <h3 class="font-bold">Pasang CiliPro</h3>
            <p class="text-sm text-green-100">Pasang ke skrin utama telefon.</p>
        </div>
        <div class="flex gap-2">
            <button id="btnInstall" class="bg-white text-green-700 px-3 py-1.5 rounded-lg font-bold text-sm shadow">Pasang</button>
            <button id="btnCloseInstall" class="text-green-200 p-2"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <header class="bg-green-600 text-white p-4 shadow-md sticky top-0 z-40">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-pepper-hot"></i> CiliPro
        </h1>
    </header>

    <main id="app" class="p-4 space-y-6">
        <section id="tab-dashboard" class="tab-content active space-y-4">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <h2 class="text-gray-500 text-sm font-semibold mb-2">Cuaca Semasa (GPS)</h2>
                <div id="weather-widget" class="flex items-center gap-4 text-green-700">
                    <i class="fas fa-spinner fa-spin text-2xl"></i>
                    <span class="text-sm">Mendapatkan lokasi...</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 rounded-xl p-4 border border-blue-100">
                    <p class="text-xs text-blue-600 font-bold uppercase">Pokok Hidup</p>
                    <h3 id="stat-total-plants" class="text-2xl font-bold text-blue-800">0</h3>
                </div>
                <div class="bg-orange-50 rounded-xl p-4 border border-orange-100">
                    <p class="text-xs text-orange-600 font-bold uppercase">Batch Aktif</p>
                    <h3 id="stat-total-batches" class="text-2xl font-bold text-orange-800">0</h3>
                </div>
                <div class="bg-green-50 rounded-xl p-4 border border-green-100">
                    <p class="text-xs text-green-600 font-bold uppercase">Pendapatan</p>
                    <h3 id="stat-total-income" class="text-lg font-bold text-green-800">RM 0</h3>
                </div>
                <div class="bg-red-50 rounded-xl p-4 border border-red-100">
                    <p class="text-xs text-red-600 font-bold uppercase">Perbelanjaan</p>
                    <h3 id="stat-total-expenses" class="text-lg font-bold text-red-800">RM 0</h3>
                </div>
            </div>
        </section>

        <section id="tab-batch" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-lg">Kebun & Batch</h2>
                <button onclick="toggleModal('batchModal')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm shadow"><i class="fas fa-plus"></i> Tambah</button>
            </div>
            <div id="batch-list" class="space-y-3">
                <!-- Batches will be rendered here -->
            </div>
        </section>

        <section id="tab-tasks" class="tab-content space-y-4">
            <h2 class="font-bold text-lg">Info Baja & Tugasan</h2>
            <div id="tasks-list" class="space-y-3">
                <!-- Tasks will be rendered here -->
            </div>
        </section>

        <section id="tab-finance" class="tab-content space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-lg">Kewangan</h2>
                <button onclick="toggleModal('financeModal')" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm shadow"><i class="fas fa-plus"></i> Rekod</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4">
                <div id="finance-list" class="space-y-2 divide-y divide-gray-100">
                    <!-- Transactions will be rendered here -->
                </div>
            </div>
        </section>
    </main>

    <div id="batchModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">Tambah Batch</h3>
                <button onclick="toggleModal('batchModal')" class="text-gray-400 text-xl">&times;</button>
            </div>
            <form id="form-batch" class="space-y-3">
                <div>
                    <label class="block text-sm text-gray-600">Nama Batch</label>
                    <input type="text" id="b-name" required class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600">Tarikh Semai</label>
                    <input type="date" id="b-date" required class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600">Bilangan Polybag Awal</label>
                    <input type="number" id="b-count" required min="1" class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600">Tetapan Baja</label>
                    <select id="b-fert" class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                        <option value="AB">Baja AB (Fertigasi)</option>
                        <option value="NPK">Baja NPK (Granul)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white rounded-lg p-2 font-bold mt-2 shadow">Simpan</button>
            </form>
        </div>
    </div>

    <div id="financeModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">Rekod Transaksi</h3>
                <button onclick="toggleModal('financeModal')" class="text-gray-400 text-xl">&times;</button>
            </div>
            <form id="form-finance" class="space-y-3">
                <div>
                    <label class="block text-sm text-gray-600">Jenis</label>
                    <select id="f-type" class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                        <option value="income">Jualan Hasil (+)</option>
                        <option value="expense">Perbelanjaan (-)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600">Jumlah (RM)</label>
                    <input type="number" id="f-amount" required min="0" step="0.01" class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-600">Nota</label>
                    <input type="text" id="f-desc" required class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white rounded-lg p-2 font-bold mt-2 shadow">Simpan</button>
            </form>
        </div>
    </div>

    <div id="survivalModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-5 space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">Kemaskini Pokok Hidup</h3>
                <button onclick="toggleModal('survivalModal')" class="text-gray-400 text-xl">&times;</button>
            </div>
            <form id="form-survival" class="space-y-3">
                <input type="hidden" id="s-id">
                <div>
                    <label class="block text-sm text-gray-600">Pokok yang masih hidup</label>
                    <input type="number" id="s-count" required min="0" class="w-full border rounded-lg p-2 mt-1 focus:ring-green-500 focus:border-green-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white rounded-lg p-2 font-bold mt-2 shadow">Kemaskini</button>
            </form>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-gray-200 pb-safe z-40">
        <div class="flex justify-around items-center h-16">
            <button onclick="switchTab('dashboard')" class="nav-btn active flex flex-col items-center justify-center w-full h-full text-green-600" data-target="dashboard">
                <i class="fas fa-home text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Utama</span>
            </button>
            <button onclick="switchTab('batch')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-600" data-target="batch">
                <i class="fas fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Batch</span>
            </button>
            <button onclick="switchTab('tasks')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-600" data-target="tasks">
                <i class="fas fa-seedling text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Baja</span>
            </button>
            <button onclick="switchTab('finance')" class="nav-btn flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-green-600" data-target="finance">
                <i class="fas fa-wallet text-xl mb-1"></i>
                <span class="text-[10px] font-medium">Kewangan</span>
            </button>
        </div>
    </nav>

    <script>
        // Data State and LocalStorage
        let state = {
            batches: JSON.parse(localStorage.getItem('cilipro_batches')) || [],
            finances: JSON.parse(localStorage.getItem('cilipro_finances')) || []
        };

        const saveState = () => {
            localStorage.setItem('cilipro_batches', JSON.stringify(state.batches));
            localStorage.setItem('cilipro_finances', JSON.stringify(state.finances));
            renderAll();
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker didaftarkan.'))
                    .catch(err => console.log('Pendaftaran SW gagal:', err));
            });
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installPrompt').classList.remove('hidden');
        });

        document.getElementById('btnInstall').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installPrompt').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        document.getElementById('btnCloseInstall').addEventListener('click', () => {
            document.getElementById('installPrompt').classList.add('hidden');
        });

        // Tab Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const isActive = btn.dataset.target === tabId;
                btn.classList.toggle('text-green-600', isActive);
                btn.classList.toggle('text-gray-400', !isActive);
            });
        }

        function toggleModal(id) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden');
        }

        async function fetchWeather() {
            const widget = document.getElementById('weather-widget');
            if (!navigator.geolocation) {
                widget.innerHTML = '<span class="text-sm text-red-500">Tiada akses GPS.</span>';
                return;
            }
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const { latitude, longitude } = pos.coords;
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
                    const data = await res.json();
                    widget.innerHTML = `
                        <div class="flex items-center gap-3">
                            <i class="fas fa-cloud-sun text-3xl text-orange-400"></i>
                            <div>
                                <div class="font-bold text-xl">${data.current_weather.temperature}°C</div>
                                <div class="text-xs text-gray-500">Kelajuan Angin: ${data.current_weather.windspeed} km/j</div>
                            </div>
                        </div>
                    `;
                } catch (e) {
                    widget.innerHTML = '<span class="text-sm text-red-500">Gagal sambung ke cuaca.</span>';
                }
            }, () => {
                widget.innerHTML = '<span class="text-sm text-orange-500">Sila benarkan akses lokasi.</span>';
            });
        }

        function getPhase(days) {
            if (days < 0) return { name: 'Belum Mula', color: 'bg-gray-200 text-gray-700' };
            if (days <= 14) return { name: 'Semai', color: 'bg-blue-100 text-blue-700' };
            if (days <= 45) return { name: 'Pindah', color: 'bg-green-100 text-green-700' };
            if (days <= 75) return { name: 'Bunga', color: 'bg-pink-100 text-pink-700' };
            return { name: 'Tuai', color: 'bg-red-100 text-red-700' };
        }

        // Form Event Listeners
        document.getElementById('form-batch').addEventListener('submit', (e) => {
            e.preventDefault();
            state.batches.push({
                id: Date.now().toString(),
                name: document.getElementById('b-name').value,
                date: document.getElementById('b-date').value,
                initial: parseInt(document.getElementById('b-count').value),
                survived: parseInt(document.getElementById('b-count').value),
                fert: document.getElementById('b-fert').value
            });
            saveState();
            toggleModal('batchModal');
            e.target.reset();
        });

        document.getElementById('form-finance').addEventListener('submit', (e) => {
            e.preventDefault();
            state.finances.push({
                id: Date.now().toString(),
                type: document.getElementById('f-type').value,
                amount: parseFloat(document.getElementById('f-amount').value),
                desc: document.getElementById('f-desc').value,
                date: new Date().toISOString()
            });
            saveState();
            toggleModal('financeModal');
            e.target.reset();
        });

        document.getElementById('form-survival').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('s-id').value;
            const batch = state.batches.find(b => b.id === id);
            if(batch) {
                batch.survived = parseInt(document.getElementById('s-count').value);
                saveState();
            }
            toggleModal('survivalModal');
        });

        window.openSurvivalModal = (id, current) => {
            document.getElementById('s-id').value = id;
            document.getElementById('s-count').value = current;
            toggleModal('survivalModal');
        };

        window.deleteBatch = (id) => {
            state.batches = state.batches.filter(b => b.id !== id);
            saveState();
        };

        window.deleteFinance = (id) => {
            state.finances = state.finances.filter(f => f.id !== id);
            saveState();
        };

        function renderAll() {
            const totalActive = state.batches.length;
            const totalPlants = state.batches.reduce((sum, b) => sum + b.survived, 0);
            const totalIncome = state.finances.filter(f => f.type === 'income').reduce((sum, f) => sum + f.amount, 0);
            const totalExpense = state.finances.filter(f => f.type === 'expense').reduce((sum, f) => sum + f.amount, 0);

            document.getElementById('stat-total-batches').innerText = totalActive;
            document.getElementById('stat-total-plants').innerText = totalPlants;
            document.getElementById('stat-total-income').innerText = `RM ${totalIncome.toFixed(2)}`;
            document.getElementById('stat-total-expenses').innerText = `RM ${totalExpense.toFixed(2)}`;

            const batchList = document.getElementById('batch-list');
            batchList.innerHTML = state.batches.map(b => {
                const days = Math.floor((new Date() - new Date(b.date)) / (1000 * 60 * 60 * 24));
                const phase = getPhase(days);
                return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg">${b.name}</h4>
                            <p class="text-xs text-gray-500">Semai: ${b.date} • ${days} Hari</p>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-1 rounded-full ${phase.color}">${phase.name}</span>
                    </div>
                    <div class="flex justify-between items-end mt-2">
                        <div>
                            <p class="text-sm font-medium text-gray-700">Hidup: <span class="text-green-600 font-bold">${b.survived}</span> / ${b.initial}</p>
                            <p class="text-xs text-gray-500">Baja: ${b.fert === 'AB' ? 'Cecair AB' : 'NPK Granul'}</p>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="openSurvivalModal('${b.id}', ${b.survived})" class="text-blue-500 p-2 bg-blue-50 rounded"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteBatch('${b.id}')" class="text-red-500 p-2 bg-red-50 rounded"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('') || '<p class="text-sm text-gray-500 text-center py-4">Belum ada batch direkodkan.</p>';

            const tasksList = document.getElementById('tasks-list');
            tasksList.innerHTML = state.batches.map(b => {
                const days = Math.floor((new Date() - new Date(b.date)) / (1000 * 60 * 60 * 24));
                const phase = getPhase(days);
                
                let taskHTML = '';
                if (b.fert === 'AB') {
                    if (days <= 14) taskHTML = 'Siram baja AB dengan kepekatan EC 1.0 - 1.2';
                    else if (days <= 45) taskHTML = 'Siram baja AB EC 1.5 - 1.8, periksa tong air baja';
                    else if (days <= 75) taskHTML = 'Siram baja AB EC 2.0 - 2.5, tambah Foliar Kalsium';
                    else taskHTML = 'Teruskan EC 2.0+, kekalkan jadual pam air';
                } else {
                    if (days <= 14) taskHTML = 'Sembur foliar organik, siram air kosong';
                    else if (days <= 45) taskHTML = 'Tabur NPK 15:15:15 5g sepokok, siram air 2 kali sehari';
                    else if (days <= 75) taskHTML = 'Tabur NPK 12:12:17 10g sepokok, kawal serangga perosak';
                    else taskHTML = 'Baja NPK tinggi Kalium untuk buah, cuci pangkal';
                }

                return `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-l-4 border-l-green-500">
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="font-bold text-gray-800">${b.name}</h4>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${phase.color}">${phase.name}</span>
                    </div>
                    <div class="text-sm text-gray-600 bg-gray-50 p-2 rounded mt-2 flex items-start gap-2">
                        <i class="fas fa-check-circle text-green-500 mt-1"></i>
                        <span>${taskHTML}</span>
                    </div>
                </div>`;
            }).join('') || '<p class="text-sm text-gray-500 text-center py-4">Tiada tugasan baja buat masa ini.</p>';

            const financeList = document.getElementById('finance-list');
            financeList.innerHTML = [...state.finances].reverse().map(f => {
                const isIncome = f.type === 'income';
                return `
                <div class="py-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="${isIncome ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} w-10 h-10 rounded-full flex items-center justify-center">
                            <i class="fas ${isIncome ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${f.desc}</p>
                            <p class="text-[10px] text-gray-500">${new Date(f.date).toLocaleDateString('ms-MY')}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">
                            ${isIncome ? '+' : '-'} RM ${f.amount.toFixed(2)}
                        </span>
                        <button onclick="deleteFinance('${f.id}')" class="text-gray-300 hover:text-red-500 p-1"><i class="fas fa-times"></i></button>
                    </div>
                </div>`;
            }).join('') || '<p class="text-sm text-gray-500 text-center py-4">Tiada rekod kewangan.</p>';
        }

        fetchWeather();
        renderAll();
    </script>
</body>
</html>
